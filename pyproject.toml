[project]
name = "diario-aberto"
version = "0.1.0"
description = "oletor, extrator e motor de busca (textual + semântica) para o Diário Oficial de Jundiaí"
readme = "README.md"
authors = [
    { name = "Nathan Yan", email = "nathan_yan_alves@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    # Banco de dados
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    # Config e validação
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "ruff>=0.16.7",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[project.scripts]
diario-aberto = "diario_aberto:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
